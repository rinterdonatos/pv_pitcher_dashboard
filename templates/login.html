<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Paradise Valley Baseball</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/pv-logo.png') }}">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img src="{{ url_for('static', filename='img/pv-logo.png') }}" alt="Paradise Valley logo" class="login-logo">
      <h1>Paradise Valley Baseball</h1>
      <p class="login-sub">Player Progress Tracker</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="field">
          <label for="password">Site password</label>
          <input type="password" id="password" name="password" autofocus required>
        </div>
        <button class="btn" type="submit" style="width:100%;">Enter</button>
      </form>
    </div>
  </div>
</body>
</html>
